<div class="text-page" [class.text-page--writing]="text.length > 10">
  <main class="text-page__main" @pageEnter>
    <div class="text-page__logo">
      <img src="/assets/logos/logo.svg" alt="Logo" />
    </div>

    <div
      class="text-page__circle"
      [class.text-page__circle--active]="text.length > 0"
    >
      <textarea
        #textInput
        class="text-page__input"
        [placeholder]="currentPlaceholder"
        rows="5"
        [(ngModel)]="text"
      ></textarea>
    </div>

    @if (text.length > 3) {
    <button type="button" class="text-page__continue">
      Descobrir minha playlist
    </button>
    }

    <a routerLink="/home" class="text-page__back">Voltar</a>
  </main>
</div>
