<div class="onboarding-step" @pageEnter>
  <div class="onboarding-step__logo animate-item">
    <img src="/assets/logos/logo.svg" alt="Moodwave" />
  </div>
  <div class="onboarding-step__content">
    <div class="onboarding-step__emoji animate-item">✨</div>
    <h1 class="onboarding-step__title animate-item">
      Falar sobre o momento ajuda.
    </h1>
    <p class="onboarding-step__subtitle animate-item">
      Texto ou áudio. Do seu jeito.
    </p>
  </div>

  <div class="onboarding-arcs onboarding-arcs--step3" aria-hidden="true">
    <div class="onboarding-arcs__layer onboarding-arcs__layer--1"></div>
    <div class="onboarding-arcs__layer onboarding-arcs__layer--2"></div>
    <div class="onboarding-arcs__layer onboarding-arcs__layer--3"></div>
  </div>

  <div class="onboarding-step__footer animate-item">
    <app-pagination-dots [total]="3" [current]="2" />
    <app-primary-button
      label="Próximo"
      [disabled]="isTransitioning"
      (click)="startExit()"
    />
    <a routerLink="/onboarding/step2" class="onboarding-step__back">Voltar</a>
  </div>

  <div
    class="onboarding-step__exit-arc"
    [class.onboarding-step__exit-arc--active]="isTransitioning"
    aria-hidden="true"
  ></div>
</div>
