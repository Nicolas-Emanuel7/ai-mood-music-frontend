<div class="home">
  <div class="home-circles" aria-hidden="true">
    <div class="home-circles__layer home-circles__layer--3"></div>
    <div class="home-circles__layer home-circles__layer--2"></div>
    <div class="home-circles__layer home-circles__layer--1"></div>
    <div class="home-circles__layer home-circles__layer--white"></div>
  </div>

  <main class="home__main">
    <h1 class="home__title">De que forma deseja se expressar?</h1>

    <div class="home__actions">
      <a
        [routerLink]="['/mood/text']"
        class="home__btn home__btn--side"
        aria-label="Expressar por texto"
      >
        <svg
          class="home__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
      </a>
      <a
        [routerLink]="['/mood/microphone']"
        class="home__btn home__btn--center"
        aria-label="Expressar por voz"
      >
        <svg
          class="home__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
      </a>
      <a
        [routerLink]="['/mood/facial']"
        class="home__btn home__btn--side"
        aria-label="Expressar por expressão"
      >
        <svg
          class="home__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M8 14s1.5 2 4 2 4-2 4-2" />
          <line x1="9" y1="9" x2="9.01" y2="9" />
          <line x1="15" y1="9" x2="15.01" y2="9" />
        </svg>
      </a>
    </div>

    <a [routerLink]="['/about']" class="home__about">Saiba mais...</a>
  </main>
</div>
